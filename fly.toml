app = "chatgust"
primary_region = "nrt"

# このアプリは全配信を1プロセスで監視するシングルトン構成。
# 複数マシンが動くと検知・通知が多重化（Discord通知が二重に届く）するため、
# デプロイ後は必ず `flyctl scale count 1 -a chatgust` で1台に固定すること。
# （マシン台数は fly.toml では宣言できず、scale コマンドで管理する）

[build]

[env]
  # 振り返りDBは永続ディスク（Volume）上に置く。下の [mounts] の destination と揃える。
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# 振り返りレポートを再デプロイ・再起動をまたいで残すための永続ボリューム。
# 事前に `flyctl volumes create chatgust_data --size 1 -a <your-app-name>` で作成しておく。
[mounts]
  source = "chatgust_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
